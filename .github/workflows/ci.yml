name: CI

on:
  push:
  pull_request:
  # Lets the suite be re-run from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/pint --test

  static-analysis:
    name: Static analysis (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            coverage: pcov
          - php: '8.5'
            coverage: none
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, intl, pcntl, pdo_sqlite
          coverage: ${{ matrix.coverage }}
      - uses: ramsey/composer-install@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      # Fakes only: no Docker, no network. The integration group is excluded.
      - name: Run tests
        run: vendor/bin/pest --ci ${{ matrix.coverage == 'pcov' && '--coverage --min=90' || '' }}

  integration:
    name: Integration (docker compose)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - name: Start the simulated partner services
        run: |
          cp .env.example .env
          APP_UID=$(id -u) docker compose build app
          docker compose up -d --wait s3 s3-setup sftp partner-api mailpit
      - name: Install dependencies in the app container
        run: docker compose run --rm --no-deps app sh -c "composer install --no-interaction --no-progress && php artisan key:generate"
      - name: Run the integration group
        run: docker compose run --rm --no-deps app vendor/bin/pest --ci --group=integration
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes
